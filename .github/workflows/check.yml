name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check runtime versions
        run: |
          python3 --version
          node --version
      - name: Build and run regression checks
        run: python3 scripts/check.py
      - name: Verify full-bank JSON roundtrip
        run: node scripts/check-bank-roundtrip.cjs
